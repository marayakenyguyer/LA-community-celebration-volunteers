<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); padding: 24px; box-sizing: border-box; }
  .wrap { display: flex; flex-direction: column; gap: 22px; }
  .group { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 10px; }
  .col { display: flex; gap: 18px; flex-wrap: wrap; }
  .field { width: 240px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Button, Input, Select, Checkbox, Switch } = window.CityVolunteersLA2028DesignSystem_ea1102;
  function Demo() {
    const [cb, setCb] = React.useState(true);
    const [sw, setSw] = React.useState(true);
    const [loc, setLoc] = React.useState("");
    return (
      <div className="wrap">
        <div>
          <p className="label">Buttons</p>
          <div className="group">
            <Button variant="gold" pop>Become a Volunteer</Button>
            <Button variant="primary">Primary</Button>
            <Button variant="dark">Dark</Button>
            <Button variant="outline">Outline</Button>
            <Button variant="ghost">Ghost</Button>
            <Button variant="primary" disabled>Disabled</Button>
          </div>
        </div>
        <div className="col">
          <div className="field"><Input label="Email address" type="email" placeholder="you@email.com" hint="For shift updates only." /></div>
          <div className="field"><Select label="Preferred location" placeholder="Choose a city" value={loc} onChange={e=>setLoc(e.target.value)} options={["Greater Los Angeles","San Diego","San José"]} /></div>
        </div>
        <div className="group" style={{gap:"28px"}}>
          <Checkbox label="Available March–August 2028" checked={cb} onChange={e=>setCb(e.target.checked)} />
          <Switch label="Text me about open shifts" checked={sw} onChange={setSw} accent="gold" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
