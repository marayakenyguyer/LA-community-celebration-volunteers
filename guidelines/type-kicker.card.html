<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--ink-900); padding: 22px 24px; box-sizing: border-box; color: #fff; }
  .k { font-family: var(--font-mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-400); margin: 0 0 14px; }
  .stat { display: flex; align-items: baseline; gap: 16px; }
  .num { font-family: var(--font-display); font-size: 46px; line-height: 1; color: #fff; }
  .lab { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--blue-300); }
</style>
</head>
<body>
  <p class="k">Mission · LA 2028</p>
  <div class="stat">
    <span class="num">25,000+</span>
    <span class="lab">Total volunteer shifts</span>
  </div>
</body>
</html>
