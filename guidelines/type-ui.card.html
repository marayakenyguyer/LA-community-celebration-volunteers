<!-- @dsCard group="Type" viewport="700x250" name="UI & Body — Archivo" subtitle="Subheads, buttons and interface text" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); padding: 20px 24px; box-sizing: border-box; font-family: var(--font-sans); color: var(--ink-900); }
  .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 12px; }
  .a900 { font-weight: 900; font-size: 28px; letter-spacing: -.02em; margin: 0 0 4px; }
  .a700 { font-weight: 700; font-size: 20px; margin: 0 0 4px; }
  .a600 { font-weight: 600; font-size: 16px; margin: 0 0 4px; }
  .a400 { font-weight: 400; font-size: 15px; color: var(--text-body); margin: 0; }
  .row { display: flex; align-items: baseline; gap: 12px; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <p class="k">UI · Archivo</p>
  <div class="row"><p class="a900">Black 900</p><span class="tag">headlines & stats</span></div>
  <div class="row"><p class="a700">Bold 700</p><span class="tag">subheads & buttons</span></div>
  <div class="row"><p class="a600">Semibold 600</p><span class="tag">labels & nav</span></div>
  <div class="row"><p class="a400">Regular 400 — interface copy and short paragraphs.</p></div>
</body>
</html>
