<!-- @dsCard group="Colors" viewport="700x180" name="Sunset Accents" subtitle="Coral, magenta, jacaranda, palm & ocean — the carnival" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-mono); background: var(--surface-card); }
  .row { display: flex; gap: 0; }
  .sw { flex: 1; height: 140px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-sizing: border-box; color: #fff; }
  .sw b { font-family: var(--font-sans); font-weight: 800; font-size: 11.5px; display: block; letter-spacing: .02em; }
  .sw span { font-size: 10.5px; opacity: .9; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--coral-500)"><b>CORAL</b><span>#FF6B3D</span></div>
    <div class="sw" style="background:var(--magenta-500)"><b>MAGENTA</b><span>#FF2D8B</span></div>
    <div class="sw" style="background:var(--purple-500)"><b>JACARANDA</b><span>#7B3FF2</span></div>
    <div class="sw" style="background:var(--green-500)"><b>PALM</b><span>#2FB457</span></div>
    <div class="sw" style="background:var(--cyan-400);color:var(--ink-900)"><b>OCEAN</b><span>#2FD0D6</span></div>
  </div>
</body>
</html>
