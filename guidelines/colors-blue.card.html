<!-- @dsCard group="Colors" viewport="700x180" name="Civic Blue — Primary" subtitle="LA sky blue, the program's anchor color" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-mono); background: var(--surface-card); }
  .row { display: flex; gap: 0; }
  .sw { flex: 1; height: 140px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-sizing: border-box; }
  .sw b { font-family: var(--font-sans); font-weight: 800; font-size: 12px; display: block; letter-spacing: .02em; }
  .sw span { font-size: 11px; opacity: .85; }
  .dark { color: #fff; } .light { color: var(--ink-900); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw dark" style="background:var(--blue-700)"><b>700</b><span>#0B3A8C</span></div>
    <div class="sw dark" style="background:var(--blue-600)"><b>600</b><span>#1457C4</span></div>
    <div class="sw dark" style="background:var(--blue-500)"><b>500 · PRIMARY</b><span>#1A6CE7</span></div>
    <div class="sw dark" style="background:var(--blue-400)"><b>400</b><span>#4E92F4</span></div>
    <div class="sw light" style="background:var(--blue-300)"><b>300</b><span>#8FBBFA</span></div>
    <div class="sw light" style="background:var(--blue-100)"><b>100 · SKY</b><span>#E6F0FF</span></div>
  </div>
</body>
</html>
