<!-- @dsCard group="Colors" viewport="700x180" name="Marigold — Secondary" subtitle="The LA sun, used for energy & calls to action" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-mono); background: var(--surface-card); }
  .row { display: flex; gap: 0; }
  .sw { flex: 1; height: 140px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-sizing: border-box; color: var(--ink-900); }
  .sw b { font-family: var(--font-sans); font-weight: 800; font-size: 12px; display: block; letter-spacing: .02em; }
  .sw span { font-size: 11px; opacity: .8; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--gold-600);color:#fff"><b>600</b><span>#E08A00</span></div>
    <div class="sw" style="background:var(--gold-500)"><b>500 · SECONDARY</b><span>#FFB200</span></div>
    <div class="sw" style="background:var(--gold-400)"><b>400</b><span>#FFC53D</span></div>
    <div class="sw" style="background:var(--gold-200)"><b>200</b><span>#FFE6A6</span></div>
    <div class="sw" style="background:var(--gold-100)"><b>100 · SUN</b><span>#FFF4D6</span></div>
  </div>
</body>
</html>
