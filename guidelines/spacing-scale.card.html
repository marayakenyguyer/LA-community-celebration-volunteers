<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing Scale" subtitle="8px rhythm, 1–10 steps" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); padding: 22px 24px; box-sizing: border-box; font-family: var(--font-mono); }
  .row { display: flex; align-items: flex-end; gap: 14px; height: 110px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--grad-sky); border-radius: 3px 3px 0 0; width: 26px; }
  .lab { font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:8px"></div><span class="lab">2·8</span></div>
    <div class="item"><div class="bar" style="height:12px"></div><span class="lab">3·12</span></div>
    <div class="item"><div class="bar" style="height:16px"></div><span class="lab">4·16</span></div>
    <div class="item"><div class="bar" style="height:24px"></div><span class="lab">5·24</span></div>
    <div class="item"><div class="bar" style="height:32px"></div><span class="lab">6·32</span></div>
    <div class="item"><div class="bar" style="height:48px"></div><span class="lab">7·48</span></div>
    <div class="item"><div class="bar" style="height:64px"></div><span class="lab">8·64</span></div>
    <div class="item"><div class="bar" style="height:96px"></div><span class="lab">9·96</span></div>
  </div>
</body>
</html>
