<!-- @dsCard group="Colors" viewport="700x200" name="Signature Gradients" subtitle="Sunset, sky, dusk & the full rainbow arc" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-mono); background: var(--surface-card); padding: 14px; box-sizing: border-box; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .g { height: 38px; border-radius: var(--radius-pill); display: flex; align-items: center; padding: 0 16px; color: #fff; font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="stack">
    <div class="g" style="background:var(--grad-sunset)">--grad-sunset · gold → coral → magenta</div>
    <div class="g" style="background:var(--grad-sky)">--grad-sky · blue → ocean</div>
    <div class="g" style="background:var(--grad-dusk)">--grad-dusk · blue → jacaranda → magenta</div>
    <div class="g" style="background:var(--grad-rainbow)">--grad-rainbow · the full LA arc</div>
  </div>
</body>
</html>
