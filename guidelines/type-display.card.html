<!-- @dsCard group="Type" viewport="700x230" name="Display — Anton" subtitle="The stadium headline: condensed, all-caps, loud" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); padding: 20px 24px; box-sizing: border-box; }
  .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 6px; }
  h1 { font-family: var(--font-display); text-transform: uppercase; line-height: .9; letter-spacing: -0.01em; color: var(--ink-900); margin: 0; }
  .xl { font-size: 64px; }
  .grad { background: var(--grad-sunset); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 14px; }
</style>
</head>
<body>
  <p class="k">Display / Anton</p>
  <h1 class="xl">WELCOME<br><span class="grad">THE WORLD</span></h1>
  <p class="meta">--font-display · uppercase · line-height .9 · used at clamp(3.5–8rem)</p>
</body>
</html>
